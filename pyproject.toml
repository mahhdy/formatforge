[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "formatforge"
version = "0.1.0"
description = "????? ???? ????? ????? ???????? ?? MDX"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{name = "Ali Mohammadi", email = "ali@example.com"}]

dependencies = [
    "click>=8.1",
    "rich>=13.7", 

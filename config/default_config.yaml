# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# FormatForge — Default Configuration
# تنظیمات پیش‌فرض (این فایل را ویرایش نکنید)
# برای سفارشی‌سازی از user_config.yaml استفاده کنید.
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# === عمومی ===
general:
  language: "fa"
  verbose: true
  color: true
  confirm_before_convert: true
  confirm_before_deploy: true
  auto_fix_warnings: false
  temp_dir: "~/.formatforge/temp/"
  log_dir: "~/.formatforge/logs/"
  report_file: "~/.formatforge/central_log.yaml"

# === اسکنر ===
scanner:
  max_file_size_mb: 100
  supported_formats:
    - latex
    - html
    - markdown
    - docx
    - pdf
    - rst
    - asciidoc
    - epub
    - notebook
  ignore_patterns:
    - "*.aux"
    - "*.log"
    - "*.synctex*"
    - "*.fls"
    - "*.fdb_latexmk"
    - ".git/"
    - "node_modules/"
    - "__pycache__/"
    - ".DS_Store"
    - "Thumbs.db"

# === متادیتا ===
metadata:
  default_author:
    name: ""
    nameEn: ""
    email: ""
  default_lang: "fa"
  default_dir: "rtl"
  slug_max_length: 60
  slug_transliterate: true
  ai_provider: "none"
  ai_model: "gpt-4o"
  ai_auto_complete:
    description: true
    tags: true
    title_en: true
    slug: true
  require_fields:
    - title
    - slug
    - date
    - lang
    - dir
    - author

# === تبدیل ===
conversion:
  # --- ریاضی ---
  math:
    engine: "katex"
    display_mode_delimiters: ["$$", "$$"]
    inline_mode_delimiters: ["$", "$"]
    throw_on_error: false
    macros: {}

  # --- نمودار ---
  diagrams:
    tikz_to: "svg"
    tikz_dpi: 300
    mermaid_to: "component"
    mermaid_theme: "base"

  # --- تصویر ---
  images:
    optimize: true
    convert_to_webp: true
    max_width: 1200
    quality: 85
    svg_optimize: true

  # --- کد ---
  code:
    add_line_numbers: false
    default_language: "text"
    highlight_theme: "github-dark"

  # --- جدول ---
  tables:
    complex_to_html: true
    simple_to_markdown: true

  # --- فارسی (حیاتی!) ---
  persian:
    preserve_zwnj: true       # ⚠ هرگز false نشود!
    fix_arabic_yeh: true       # ي → ی
    fix_arabic_keh: true       # ك → ک
    fix_spacing: true
    numerals: "persian"        # persian | latin | keep
    quotation_marks: "guillemet"  # «» not ""

  # --- MDX ---
  mdx:
    component_style: "import"
    jsx_runtime: "react"
    mdx_version: 3

# === تست کیفیت ===
testing:
  run_structural: true
  run_content: true
  run_math: true
  run_persian: true
  run_links: true
  run_visual: false
  min_quality_score: 80
  visual_compare_with_source: false

# === استقرار ===
deployment:
  target_dir: "./output/"
  create_backup: true
  backup_dir: "~/.formatforge/backups/"
  overwrite_existing: "ask"
  post_deploy:
    open_in_editor: false
    editor_command: "code"
    run_dev_server: false
    dev_command: "npm run dev"
    git_commit: false
    git_push: false

# === گزارش ===
reporting:
  format: "yaml"
  keep_history: true
  max_history: 1000
  export_on_milestone: true
